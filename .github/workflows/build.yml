name: Build Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Verify bundled mods
        run: npm run test:packaging
      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build:win
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Odal-Launcher-Windows
          path: dist/*.exe

  build-mac:
    # macos-latest est passe sous macOS 26 le 05/09/2026 et la signature y echoue
    # systematiquement (SecKeychainUnlock au set-key-partition-list) : image epinglee.
    runs-on: macos-15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Verify bundled mods
        run: npm run test:packaging
      - name: Prepare Apple API key
        shell: bash
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Build Mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          npm run build:mac 2>&1 | tee build-mac.log
      # Le build Mac echoue par intermittence et les logs Actions ne sont pas
      # lisibles sans compte : on publie la fin du log en issue pour diagnostic.
      - name: Publier l'erreur en issue si echec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 6000 build-mac.log > extrait.txt || echo "pas de log" > extrait.txt
          gh issue create --repo "$GITHUB_REPOSITORY"             --title "build-mac en echec (run $GITHUB_RUN_ID)"             --body-file extrait.txt || true
      - name: Verify Mac application resources
        shell: bash
        run: |
          RESOURCES_DIR="$(find dist -type d -path '*/Odal Launcher.app/Contents/Resources' -print -quit)"
          test -n "$RESOURCES_DIR"
          node test-packaging.js "$RESOURCES_DIR"
          node test-update-gate.js "$RESOURCES_DIR/app.asar"
      - name: Upload Mac artifact
        uses: actions/upload-artifact@v4
        with:
          name: Odal-Launcher-Mac
          path: dist/*.dmg

  release:
    # Le build Mac echoue par intermittence (outillage/signature) : il ne doit
    # jamais bloquer la publication Windows. Le .dmg de la release precedente
    # reste en place tant qu'un build Mac n'a pas reussi a nouveau.
    needs: [build-windows, build-mac]
    if: always() && needs.build-windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows build
        uses: actions/download-artifact@v4
        with:
          name: Odal-Launcher-Windows
          path: ./windows

      - name: Download Mac build
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: Odal-Launcher-Mac
          path: ./mac

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Odal Launcher - Dernière version"
          body: "Télécharge le launcher pour rejoindre le serveur Odal !"
          files: |
            ./windows/*.exe
            ./mac/*.dmg
